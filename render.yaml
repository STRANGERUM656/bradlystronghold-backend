services:
  - type: web
    name: bradlystronghold-backend
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: RIVETKIT_HOST
        value: 0.0.0.0
      - key: HOST
        value: 0.0.0.0
      - key: RIVETKIT_PORT
        fromService:
          type: web
          name: bradlystronghold-backend
          property: port
